[package]
name = "wam"
version = "0.1.0"
description = "WAM - a modern media player"
authors = ["WAM"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
axum = "0.8"
mime_guess = "2"
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
futures-lite = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
