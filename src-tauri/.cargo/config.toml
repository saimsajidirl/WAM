# The x86_64-pc-windows-gnu toolchain needs GNU binutils+gcc for build-script
# import libs (dlltool) and linking. A standalone MinGW-w64 toolchain lives in
# ~/.wam-tools/mingw64/bin (winlibs build). cargo cannot *append* to Path here,
# so the npm scripts (tauri:dev / tauri:build) prepend it instead; the dir is
# also on the user's PATH. windres (resource compiler for the exe icon) cannot
# handle paths containing spaces — "D:\Software Engineering\..." breaks its
# preprocessor invocation. Keep the target dir space-free.
[build]
target-dir = "D:/wam-target"

[env]
DLLTOOL = { value = "C:/Users/Saim/.wam-tools/mingw64/bin/dlltool.exe", force = true }
WINDRES = { value = "C:/Users/Saim/.wam-tools/mingw64/bin/windres.exe", force = true }
