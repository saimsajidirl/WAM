name: Build desktop app

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the target dir inside the workspace (overrides .cargo/config.toml's
  # D:\wam-target) so rust-cache can cache it and the runner needs no D: paths.
  # Must be absolute — cargo runs from src-tauri/, so a relative path here
  # would resolve to src-tauri/src-tauri/target.
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # needed to publish a GitHub Release on tags

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      # windows-latest ships MSVC + Windows SDK — embed-resource uses rc.exe,
      # so no MinGW/binutils setup is needed on CI.
      - name: Setup Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Runs `tauri build` (beforeBuildCommand -> npm run build, then cargo
      # build --release + NSIS bundling). On a v* tag push it also creates a
      # GitHub Release with the installer attached.
      - name: Build + bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "WAM v__VERSION__"
          releaseBody: "Automated build of WAM for Windows."
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wam-windows
          path: |
            src-tauri/target/release/wam.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
